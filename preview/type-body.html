<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Body type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:22px 24px;font-family:var(--font-body)}
  .lab{display:block;margin-bottom:14px}
  p{margin:0 0 10px;max-width:600px}
  .lead{font:var(--body-lg);color:var(--color-text)}
  .small{font:var(--body-sm);color:var(--color-text-secondary)}
  .meta{font-family:var(--font-mono);font-size:12px;color:var(--color-text-accent);letter-spacing:0.04em;margin-top:14px}
</style></head>
<body>
  <div class="np-label lab">Body · Sora</div>
  <p class="lead">Realtime infrastructure for teams that move fast. Spin up nodes, watch them go live, and never lose the signal.</p>
  <p class="small">Secondary copy steps down to --color-text-secondary and --color-text-muted for hierarchy on the canvas.</p>
  <div class="meta">400 / 500 / 600 · 14–18px · 1.6 line-height</div>
</body></html>
