<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badges &amp; status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:22px 24px;font-family:var(--font-mono)}
  .lab{display:block;margin-bottom:16px}
  .lab:not(:first-child){margin-top:22px}
  .np-cluster{gap:10px}
</style></head>
<body>
  <div class="np-label lab">Status · .np-badge intents</div>
  <div class="np-cluster">
    <span class="np-badge np-badge--success np-badge--live"><span class="np-badge__dot"></span>Online</span>
    <span class="np-badge np-badge--warning"><span class="np-badge__dot"></span>Degraded</span>
    <span class="np-badge np-badge--danger"><span class="np-badge__dot"></span>Offline</span>
    <span class="np-badge np-badge--info"><span class="np-badge__dot"></span>Syncing</span>
    <span class="np-badge np-badge--accent">Accent</span>
    <span class="np-badge">Draft</span>
    <span class="np-badge np-badge--outline">Outline</span>
  </div>

  <div class="np-label lab">Data · metrics, versions, regions</div>
  <div class="np-cluster">
    <span class="np-badge np-badge--success">+24.6%</span>
    <span class="np-badge np-badge--info">Beta</span>
    <span class="np-badge np-badge--outline">v3.2.0</span>
    <span class="np-badge">US-EAST</span>
  </div>
</body></html>
