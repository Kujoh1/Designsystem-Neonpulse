<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html lang="en" data-theme="dark" data-theme-lock><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeonPulse mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Brand art is intrinsically dark: data-theme-lock keeps it dark inside a light docs page. */
  html,body{margin:0}
  body{background:var(--grad-haze) no-repeat,var(--color-bg-page);padding:26px 28px;font-family:var(--font-display)}
  .lab{display:block;margin-bottom:22px}
  .lock{display:flex;align-items:center;gap:14px}
  .mark{width:34px;height:34px;border-radius:50%;position:relative;background:var(--grad-pulse);box-shadow:var(--glow-accent);flex:none}
  .mark::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--color-bg-page)}
  .mark::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--color-accent)}
  .wm{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:0.04em;color:var(--color-text)}
  .wm b{color:var(--color-text-accent)}
  .alt{display:flex;flex-wrap:wrap;gap:30px;align-items:center;margin-top:24px}
  .small{font-size:15px}
  .small .mark{width:22px;height:22px}
  .small .mark::after{inset:6px}
  .small .mark::before{inset:9px}
  .mono{font-family:var(--font-mono);font-size:12px;letter-spacing:0.3em;color:var(--color-text-secondary);text-transform:uppercase}
</style></head>
<body>
  <div class="np-label lab">Wordmark · pulse mark</div>
  <div class="lock">
    <div class="mark"></div>
    <div class="wm">NEON<b>PULSE</b></div>
  </div>
  <div class="alt">
    <div class="lock small"><div class="mark"></div><div class="wm small">NEON<b>PULSE</b></div></div>
    <div class="mono">N / P</div>
  </div>
</body></html>
