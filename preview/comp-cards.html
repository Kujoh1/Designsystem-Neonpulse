<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:20px 24px;font-family:var(--font-body)}
  .lab{display:block;margin-bottom:16px}
  /* specimen layout: let the three cards fill the row (auto-fit instead of auto-fill) */
  .np-grid{grid-template-columns:repeat(auto-fit,minmax(min(var(--np-grid-min),100%),1fr))}
</style></head>
<body>
  <div class="np-label lab">Cards · flat fill, hairline border, neon only on live / hover</div>
  <div class="np-grid" style="--np-grid-min:190px">
    <div class="np-card">
      <span class="np-card__eyebrow">Requests</span>
      <div class="np-card__metric">1.24M</div>
      <span class="np-card__delta">+24.6% ↑ · 24h</span>
    </div>
    <div class="np-card np-card--live">
      <span class="np-eyebrow"><span class="np-livedot"></span>Latency · live</span>
      <div class="np-card__metric">42ms</div>
      <span class="np-card__delta">p99 · us-east</span>
    </div>
    <div class="np-card">
      <span class="np-card__eyebrow">Nodes</span>
      <span class="np-card__title">18 online</span>
      <p class="np-card__body">All healthy. Auto-scale armed.</p>
    </div>
  </div>
</body></html>
