<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabs &amp; segmented control</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:20px 24px;font-family:var(--font-display)}
  .lab{display:block;margin-bottom:12px}
  .lab:not(:first-child){margin-top:24px}
  .panel{font:var(--body-sm);color:var(--color-text-secondary);padding:14px 2px 0}
  .panel:focus-visible{outline:none;box-shadow:var(--ring-focus);border-radius:var(--r-sm)}
  .readout{font:400 11px/1.4 var(--font-mono);color:var(--color-text-muted);margin-top:10px}
</style></head>
<body>
  <div class="np-label lab">Tabs · click or ← → to switch</div>
  <div class="np-tabs" role="tablist" aria-label="Project views">
    <button class="np-tab" role="tab" id="tab-overview" aria-controls="tabpanel" aria-selected="true" tabindex="0" data-copy="Realtime overview. 18 nodes live, p99 42ms.">Overview</button>
    <button class="np-tab" role="tab" id="tab-metrics" aria-controls="tabpanel" aria-selected="false" tabindex="-1" data-copy="Metrics. 1.24M requests in the last 24h, +24.6%.">Metrics</button>
    <button class="np-tab" role="tab" id="tab-logs" aria-controls="tabpanel" aria-selected="false" tabindex="-1" data-copy="Logs. Streaming from us-east. No errors in 6h.">Logs</button>
    <button class="np-tab" role="tab" id="tab-settings" aria-controls="tabpanel" aria-selected="false" tabindex="-1" data-copy="Settings. Auto-scale armed. Region: us-east-1.">Settings</button>
  </div>
  <div class="panel" role="tabpanel" id="tabpanel" aria-labelledby="tab-overview" tabindex="0">Realtime overview. 18 nodes live, p99 42ms.</div>

  <div class="np-label lab">Segmented control · range</div>
  <div class="np-seg" role="group" aria-label="Time range">
    <button class="np-seg__item" aria-pressed="true">Live</button>
    <button class="np-seg__item" aria-pressed="false">1H</button>
    <button class="np-seg__item" aria-pressed="false">24H</button>
    <button class="np-seg__item" aria-pressed="false">7D</button>
  </div>
  <div class="readout" aria-live="polite">Range: <span id="range">Live</span></div>

<script>
/* Tabs — WAI-ARIA tab pattern with a roving tabindex. */
(() => {
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const panel = document.getElementById('tabpanel');
  function select(tab, focus) {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
    });
    panel.setAttribute('aria-labelledby', tab.id);
    panel.textContent = tab.dataset.copy;
    if (focus) tab.focus();
  }
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => select(t, false));
    t.addEventListener('keydown', e => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      let next = null;
      if (step) next = tabs[(i + step + tabs.length) % tabs.length];
      if (e.key === 'Home') next = tabs[0];
      if (e.key === 'End') next = tabs[tabs.length - 1];
      if (next) { e.preventDefault(); select(next, true); }
    });
  });
})();

/* Segmented control — single choice via aria-pressed. */
(() => {
  const items = [...document.querySelectorAll('.np-seg__item')];
  const out = document.getElementById('range');
  items.forEach(b => b.addEventListener('click', () => {
    items.forEach(x => x.setAttribute('aria-pressed', x === b));
    out.textContent = b.textContent;
  }));
})();
</script>
</body></html>
