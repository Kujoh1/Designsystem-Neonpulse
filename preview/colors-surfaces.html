<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:20px 24px;font-family:var(--font-mono)}
  .lab{display:block;margin-bottom:16px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
  .sw{height:88px;box-sizing:border-box;border-radius:var(--r-md);border:1px solid var(--color-border);
      display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:10px}
  .n{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--color-text)}
  .r,.h{font-size:10px;letter-spacing:0.04em;color:var(--color-text-secondary)}
</style></head>
<body>
  <div class="np-label lab">Surfaces · bg ramp · void → overlay</div>
  <div class="row">
    <div class="sw" style="background:var(--bg-0)"><span class="n">bg-0</span><span class="r">void</span><span class="h" data-hex></span></div>
    <div class="sw" style="background:var(--bg-1)"><span class="n">bg-1</span><span class="r">page</span><span class="h" data-hex></span></div>
    <div class="sw" style="background:var(--bg-2)"><span class="n">bg-2</span><span class="r">surface</span><span class="h" data-hex></span></div>
    <div class="sw" style="background:var(--bg-3)"><span class="n">bg-3</span><span class="r">raised</span><span class="h" data-hex></span></div>
    <div class="sw" style="background:var(--bg-4)"><span class="n">bg-4</span><span class="r">overlay · track</span><span class="h" data-hex></span></div>
  </div>
<script>
/* Print each swatch's live value (theme-aware) — the hex is read from the
   token at runtime, never hardcoded. Re-runs when data-theme changes. */
(() => {
  const nums = s => (s.match(/-?[\d.]+(?:e-?\d+)?/g) || []).map(Number);
  function parse(s) {
    const n = nums(s), k = s.trim().startsWith('color(') ? 255 : 1;
    return { r: n[0] * k, g: n[1] * k, b: n[2] * k, a: n.length > 3 ? n[3] : 1 };
  }
  const h2 = v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0');
  const toHex = c => ('#' + h2(c.r) + h2(c.g) + h2(c.b) + (c.a < 1 ? h2(c.a * 255) : '')).toUpperCase();
  function paint() {
    document.querySelectorAll('[data-hex]').forEach(out => {
      out.textContent = toHex(parse(getComputedStyle(out.closest('.sw')).backgroundColor));
    });
  }
  paint();
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
</body></html>
