<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic colours</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:20px 24px;font-family:var(--font-mono)}
  .lab{display:block;margin-bottom:16px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .sw,.fill{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 12px;box-sizing:border-box}
  /* solid swatch: knockout text in the surface colour — bright hue + dark text
     in the dark theme, deep "ink" hue + light text in the light theme */
  .sw{min-height:48px;border-radius:var(--r-md) var(--r-md) 0 0;color:var(--color-surface)}
  .fill{min-height:42px;border-radius:0 0 var(--r-md) var(--r-md);border:1px solid var(--color-border-subtle);border-top:none}
  .n{font-size:11px;font-weight:700;letter-spacing:0.04em}
  .h{font-size:10px;font-weight:500;letter-spacing:0.04em}
</style></head>
<body>
  <div class="np-label lab">Semantic · solid + tinted fill</div>
  <div class="row">
    <div><div class="sw" style="background:var(--color-success)"><span class="n">success</span><span class="h" data-hex></span></div>
         <div class="fill" style="background:var(--color-success-fill);color:var(--color-success)"><span class="n">badge / alert</span><span class="h" data-hex></span></div></div>
    <div><div class="sw" style="background:var(--color-warning)"><span class="n">warning</span><span class="h" data-hex></span></div>
         <div class="fill" style="background:var(--color-warning-fill);color:var(--color-warning)"><span class="n">badge / alert</span><span class="h" data-hex></span></div></div>
    <div><div class="sw" style="background:var(--color-danger)"><span class="n">danger</span><span class="h" data-hex></span></div>
         <div class="fill" style="background:var(--color-danger-fill);color:var(--color-danger)"><span class="n">badge / alert</span><span class="h" data-hex></span></div></div>
    <div><div class="sw" style="background:var(--color-info)"><span class="n">info</span><span class="h" data-hex></span></div>
         <div class="fill" style="background:var(--color-info-fill);color:var(--color-info)"><span class="n">badge / alert</span><span class="h" data-hex></span></div></div>
  </div>
<script>
/* Print each swatch's live value (alpha-aware for the tinted fills) — read
   from the token at runtime, never hardcoded. Re-runs on theme change. */
(() => {
  const nums = s => (s.match(/-?[\d.]+(?:e-?\d+)?/g) || []).map(Number);
  function parse(s) {
    const n = nums(s), k = s.trim().startsWith('color(') ? 255 : 1;
    return { r: n[0] * k, g: n[1] * k, b: n[2] * k, a: n.length > 3 ? n[3] : 1 };
  }
  const h2 = v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0');
  const toHex = c => ('#' + h2(c.r) + h2(c.g) + h2(c.b) + (c.a < 1 ? h2(c.a * 255) : '')).toUpperCase();
  function paint() {
    document.querySelectorAll('[data-hex]').forEach(out => {
      out.textContent = toHex(parse(getComputedStyle(out.parentElement).backgroundColor));
    });
  }
  paint();
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
</body></html>
