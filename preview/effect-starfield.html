<!DOCTYPE html><html lang="en" data-theme="dark" data-theme-lock><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starfield</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../effects/starfield.css">
<style>
  /* Scene backdrop is intrinsically dark: data-theme-lock keeps it dark inside a light docs page.
     No fixed height — the page is as tall as its content; the starfield fills the frame. */
  html,body{margin:0}
  body{background:var(--color-bg-page);font-family:var(--font-body);color:var(--color-text);position:relative}
  .content{position:relative;z-index:1;padding:26px 28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  h3{font:var(--h3);margin:0}
  p{font:var(--body-sm);color:var(--color-text-secondary);margin:0;max-width:42ch}
  .np-code{font-size:12px}
</style></head>
<body>
  <!-- scene backdrop -->
  <div class="np-starfield" aria-hidden="true">
    <div class="nebula"></div>
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
  </div>
  <!-- content on top -->
  <div class="content">
    <div class="np-label">Effect · scene backdrop</div>
    <h3>Starfield</h3>
    <p>Token-driven neon haze + layered stars on the near-black canvas. Static by default; add <code class="np-code">np-starfield--drift</code> for a slow parallax. Reduced-motion safe.</p>
  </div>
</body></html>
