<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corner radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:20px 24px;font-family:var(--font-mono)}
  .lab{display:block;margin-bottom:18px}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  .b{width:70px;height:70px;box-sizing:border-box;background:var(--color-surface-raised);border:1px solid var(--color-border);
     display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
  .b span{font-size:9px;letter-spacing:0.04em;color:var(--color-text-secondary)}
</style></head>
<body>
  <div class="np-label lab">Corner radii · soft rounded · --r-*</div>
  <div class="row">
    <div class="b" style="border-radius:var(--r-sm)"><span>sm · 8</span></div>
    <div class="b" style="border-radius:var(--r-md)"><span>md · 12</span></div>
    <div class="b" style="border-radius:var(--r-lg)"><span>lg · 16</span></div>
    <div class="b" style="border-radius:var(--r-xl)"><span>xl · 20</span></div>
    <div class="b" style="border-radius:var(--r-2xl)"><span>2xl · 28</span></div>
    <div class="b" style="border-radius:var(--r-full)"><span>full</span></div>
  </div>
</body></html>
