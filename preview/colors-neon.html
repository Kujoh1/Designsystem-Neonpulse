<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:20px 24px;font-family:var(--font-mono)}
  .lab{display:block;margin-bottom:16px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .sw{height:96px;box-sizing:border-box;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
      padding:10px;color:var(--color-text-on-accent)}
  .n{font-size:11px;font-weight:700;letter-spacing:0.04em}
  .h,.r{font-size:10px;font-weight:500;letter-spacing:0.04em}
</style></head>
<body>
  <div class="np-label lab">Neon accents · fills only · use as ~10% signal</div>
  <div class="row">
    <div class="sw" style="background:var(--neon-blue)"><span class="n">blue</span><span class="r">action · solid</span><span class="h" data-hex></span></div>
    <div class="sw" style="background:var(--neon-cyan)"><span class="n">cyan</span><span class="r">accent · live</span><span class="h" data-hex></span></div>
    <div class="sw" style="background:var(--neon-violet)"><span class="n">violet</span><span class="r">energy</span><span class="h" data-hex></span></div>
    <div class="sw" style="background:var(--neon-magenta)"><span class="n">magenta</span><span class="r">pulse</span><span class="h" data-hex></span></div>
  </div>
<script>
/* Print each swatch's live value — read from the token at runtime, never
   hardcoded. Re-runs when data-theme changes. */
(() => {
  const nums = s => (s.match(/-?[\d.]+(?:e-?\d+)?/g) || []).map(Number);
  function parse(s) {
    const n = nums(s), k = s.trim().startsWith('color(') ? 255 : 1;
    return { r: n[0] * k, g: n[1] * k, b: n[2] * k, a: n.length > 3 ? n[3] : 1 };
  }
  const h2 = v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0');
  const toHex = c => ('#' + h2(c.r) + h2(c.g) + h2(c.b) + (c.a < 1 ? h2(c.a * 255) : '')).toUpperCase();
  function paint() {
    document.querySelectorAll('[data-hex]').forEach(out => {
      out.textContent = toHex(parse(getComputedStyle(out.closest('.sw')).backgroundColor));
    });
  }
  paint();
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
</body></html>
