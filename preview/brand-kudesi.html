<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html lang="en" data-theme="dark" data-theme-lock><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kudesi wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Brand art is intrinsically dark: data-theme-lock keeps it dark inside a light docs page. */
  html,body{margin:0}
  body{background:var(--grad-haze) no-repeat,var(--color-bg-page);padding:26px 28px;font-family:var(--font-display)}
  .lab{display:block;margin-bottom:22px}
  .row{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .logo{height:52px;width:auto;max-width:100%;display:block;filter:drop-shadow(0 0 16px color-mix(in srgb, var(--neon-cyan) 28%, transparent))}
  .logo.sm{height:30px}
  .swatches{display:flex;gap:0;margin-top:26px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--color-border);max-width:420px}
  .sw{flex:1;height:34px}
  .meta{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--color-text-muted);margin-top:10px}
</style></head>
<body>
  <div class="np-label lab">kudesi · brand wordmark</div>
  <div class="row">
    <img class="logo" src="../assets/kudesi-logo.svg" alt="kudesi">
    <img class="logo sm" src="../assets/kudesi-logo.svg" alt="kudesi (small)">
  </div>
  <!-- Gradient = NeonPulse primary "pulse": blau → cyan (--grad-pulse) -->
  <div class="swatches">
    <div class="sw" style="background:var(--neon-blue)"></div>
    <div class="sw" style="background:var(--neon-cyan)"></div>
  </div>
  <div class="meta">grad-pulse · blue → cyan</div>
</body></html>
