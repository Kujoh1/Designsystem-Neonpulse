<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mono type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:22px 24px;font-family:var(--font-mono)}
  .lab{display:block;margin-bottom:16px}
  .np-cluster{gap:10px;margin-bottom:16px}
  .data{font-family:var(--font-mono);color:var(--color-text);font-size:26px;letter-spacing:0.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .data b{font-weight:500;color:var(--color-success)}
  .meta{font-size:12px;color:var(--color-text-accent);letter-spacing:0.04em;margin-top:14px}
</style></head>
<body>
  <div class="np-label lab">HUD / Data · JetBrains Mono</div>
  <div class="np-cluster">
    <span class="np-badge np-badge--accent np-badge--live"><span class="np-badge__dot"></span>Live</span>
    <span class="np-label">System status</span>
    <span class="np-badge np-badge--outline">v3.2.0</span>
    <span class="np-badge np-badge--outline">US-EAST</span>
  </div>
  <div class="data">1,204 ms · <b>+24.6%</b> · 99.98%</div>
  <div class="meta">UPPERCASE · 0.14em tracking · tabular figures</div>
</body></html>
