<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foreground</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg-page);color:var(--color-text);padding:20px 24px;font-family:var(--font-mono)}
  .lab{display:block;margin-bottom:16px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  /* the swatch sits on the page canvas, so the sample reads against what the ratio measures */
  .sw{border:1px solid var(--color-border);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:3px}
  .dot{width:26px;height:26px;border-radius:var(--r-full);margin-bottom:7px;box-shadow:inset 0 0 0 1px var(--color-border-subtle)}
  .n{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--color-text)}
  .al,.h{font-size:10px;letter-spacing:0.04em;color:var(--color-text-muted)}
  .ex{font:600 22px/1.1 var(--font-display);margin:6px 0 4px}
  .cr{font-size:10px;letter-spacing:0.06em;color:var(--color-text-secondary)}
</style></head>
<body>
  <div class="np-label lab">Foreground · text ramp · live contrast vs page</div>
  <div class="row">
    <div class="sw"><span class="dot" style="background:var(--fg-1)"></span><span class="n">fg-1 · primary</span><span class="al">--color-text</span><div class="ex" style="color:var(--fg-1)">Aa</div><span class="h" data-hex></span><span class="cr" data-cr></span></div>
    <div class="sw"><span class="dot" style="background:var(--fg-2)"></span><span class="n">fg-2 · secondary</span><span class="al">--color-text-secondary</span><div class="ex" style="color:var(--fg-2)">Aa</div><span class="h" data-hex></span><span class="cr" data-cr></span></div>
    <div class="sw"><span class="dot" style="background:var(--fg-3)"></span><span class="n">fg-3 · muted</span><span class="al">--color-text-muted</span><div class="ex" style="color:var(--fg-3)">Aa</div><span class="h" data-hex></span><span class="cr" data-cr></span></div>
    <div class="sw" data-exempt><span class="dot" style="background:var(--fg-4)"></span><span class="n">fg-4 · disabled</span><span class="al">--color-text-disabled</span><div class="ex" style="color:var(--fg-4)">Aa</div><span class="h" data-hex></span><span class="cr" data-cr></span></div>
  </div>
<script>
/* Resolve each foreground token at runtime, print its hex and its WCAG
   contrast ratio against --color-bg-page. Re-runs on theme change. */
(() => {
  const nums = s => (s.match(/-?[\d.]+(?:e-?\d+)?/g) || []).map(Number);
  function parse(s) {
    const n = nums(s), k = s.trim().startsWith('color(') ? 255 : 1;
    return { r: n[0] * k, g: n[1] * k, b: n[2] * k, a: n.length > 3 ? n[3] : 1 };
  }
  const h2 = v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0');
  const toHex = c => ('#' + h2(c.r) + h2(c.g) + h2(c.b) + (c.a < 1 ? h2(c.a * 255) : '')).toUpperCase();
  const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const lum = c => 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
  const over = (f, b) => ({ r: f.r * f.a + b.r * (1 - f.a), g: f.g * f.a + b.g * (1 - f.a), b: f.b * f.a + b.b * (1 - f.a), a: 1 });
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const grade = r => r >= 7 ? 'AAA' : r >= 4.5 ? 'AA' : r >= 3 ? 'AA large' : 'below AA';
  function paint() {
    const page = parse(getComputedStyle(document.body).backgroundColor);
    document.querySelectorAll('.sw').forEach(sw => {
      const fg = parse(getComputedStyle(sw.querySelector('.dot')).backgroundColor);
      const r = ratio(over(fg, page), page);
      sw.querySelector('[data-hex]').textContent = toHex(fg);
      sw.querySelector('[data-cr]').textContent =
        r.toFixed(1) + ':1 · ' + (sw.hasAttribute('data-exempt') ? 'disabled only' : grade(r));
    });
  }
  paint();
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
</body></html>
