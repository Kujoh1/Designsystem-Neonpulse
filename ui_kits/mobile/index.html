<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeonPulse — Mobile UI Kit</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<script>/* theme-color follows the page token — no hardcoded hex */
  (function () { var m = document.createElement('meta'); m.name = 'theme-color';
    m.content = getComputedStyle(document.documentElement).getPropertyValue('--color-bg-page').trim(); document.head.appendChild(m); })();
</script>
<style>
  /* Kit-specific layout only — every control comes from colors_and_type.css */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--color-bg-void); background-image: var(--grad-haze);
    font-family: var(--font-body); color: var(--color-text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px 0;
    -webkit-font-smoothing: antialiased;
  }
  .npi svg { width: 100%; height: 100%; display: block; }
  .mb-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0;
    background: none; border: 0; border-radius: var(--r-md); cursor: pointer; font: inherit;
    color: var(--color-text-muted); transition: color var(--dur);
  }
  .mb-tab:hover { color: var(--color-text); }
  .mb-tab:focus-visible { outline: none; box-shadow: var(--ring-focus); }
  .mb-tab[aria-current="page"] { color: var(--color-accent); }
  .mb-tab[aria-current="page"] .npi { filter: drop-shadow(0 0 6px var(--color-accent)); }  /* active = state → glow */
  .mb-tab__label { font: 500 9.5px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  /* phones: drop the device chrome, render the app edge-to-edge */
  .mb-bleed { width: 100%; height: 100vh; height: 100dvh; }
  @media (max-width: 439px) { body { display: block; padding: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js" integrity="sha384-bdZtphetAEBgkGZvhZXOFDWc55tHGLqaSo1f4qZtgvEiolEBqlJ9u6FTk+CoLfj0" crossorigin="anonymous"></script>

<script type="text/babel">
  function Icon({ name, size = 18 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const el = ref.current; if (!el || !window.lucide) return;
      el.innerHTML = '<i data-lucide="' + name + '"></i>';
      window.lucide.createIcons();
    });
    return <span ref={ref} className="npi" style={{ display: 'inline-flex', width: size, height: size }} />;
  }
  window.Icon = Icon;
</script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="MobileApp.jsx"></script>
<script type="text/babel">
  const DEVICE = { w: 402, h: 874 };   // IOSDevice default size

  function useViewport() {
    const read = () => ({ w: window.innerWidth, h: window.innerHeight });
    const [vp, setVp] = React.useState(read);
    React.useEffect(() => {
      const on = () => setVp(read());
      window.addEventListener('resize', on);
      return () => window.removeEventListener('resize', on);
    }, []);
    return vp;
  }

  function App() {
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    const { w, h } = useViewport();
    // real phone width → edge-to-edge app; otherwise the device frame, scaled to fit the viewport height
    if (w < 440) return <div className="mb-bleed"><NeonPulseApp framed={false} /></div>;
    const fit = Math.min(1, (h - 32) / DEVICE.h, (w - 24) / DEVICE.w);
    return (
      <div style={{ zoom: fit }}>
        <IOSDevice dark>
          <NeonPulseApp />
        </IOSDevice>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
