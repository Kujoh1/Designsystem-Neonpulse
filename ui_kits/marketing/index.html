<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeonPulse — Marketing UI Kit</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<script>/* theme-color follows the page token — no hardcoded hex */
  (function () { var m = document.createElement('meta'); m.name = 'theme-color';
    m.content = getComputedStyle(document.documentElement).getPropertyValue('--color-bg-page').trim(); document.head.appendChild(m); })();
</script>
<style>
  /* Kit-specific layout only — every control comes from colors_and_type.css */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 82px; }
  html, body { margin: 0; background: var(--color-bg-page); }
  body { font-family: var(--font-body); color: var(--color-text); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .npi svg { width: 100%; height: 100%; display: block; }

  .mk-navlink {
    font: 400 14px/1 var(--font-body); color: var(--color-text-secondary); text-decoration: none;
    padding: 8px 12px; border-radius: var(--r-md); transition: color var(--dur);
  }
  .mk-navlink:hover { color: var(--color-text); }
  .mk-navlink:focus-visible, .mk-footlink:focus-visible, .mk-logo:focus-visible { outline: none; box-shadow: var(--ring-focus); }
  .mk-footlink { font: var(--body-sm); color: var(--color-text-secondary); text-decoration: none; border-radius: 2px; transition: color var(--dur); }
  .mk-footlink:hover { color: var(--color-text-accent); }

  .mk-hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 56px; align-items: center; min-height: 560px; }
  .mk-feature__icon {
    width: 44px; height: 44px; margin-bottom: 10px; border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    background: var(--color-surface-raised); color: var(--feat-accent); transition: box-shadow var(--dur);
  }
  .mk-feature:hover { border-color: var(--color-border-strong); }
  .mk-feature:hover .mk-feature__icon { box-shadow: 0 0 18px color-mix(in srgb, var(--feat-accent) 33%, transparent); }
  .mk-foot-grid { display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 32px; }

  .mk-mobile { display: none; }
  .mk-mobile[hidden] { display: none !important; }
  @media (max-width: 880px) {
    .mk-desktop { display: none !important; }
    .mk-mobile { display: flex; }
    .mk-hero-grid { grid-template-columns: minmax(0, 1fr); min-height: 0; padding-block: 40px; }
    .mk-foot-grid { grid-template-columns: 1fr 1fr; }
    .mk-foot-grid > :first-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js" integrity="sha384-bdZtphetAEBgkGZvhZXOFDWc55tHGLqaSo1f4qZtgvEiolEBqlJ9u6FTk+CoLfj0" crossorigin="anonymous"></script>

<script type="text/babel">
  // Icon component — renders a lucide <i>, refreshed after each render
  function Icon({ name, size = 18 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const el = ref.current; if (!el || !window.lucide) return;
      el.innerHTML = '<i data-lucide="' + name + '"></i>';
      window.lucide.createIcons();
    });
    return <span ref={ref} className="npi" style={{ display: 'inline-flex', width: size, height: size }} />;
  }
  window.Icon = Icon;
  window.useLucide = function () { React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }); };
</script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Features.jsx"></script>
<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  function App() {
    useLucide();
    return (
      <React.Fragment>
        <a className="np-skip" href="#main">Skip to content</a>
        <Nav />
        <main id="main" tabIndex={-1} style={{ outline: 'none' }}>
          <Hero />
          <LogoStrip />
          <Features />
          <Pricing />
          <CTABand />
        </main>
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
